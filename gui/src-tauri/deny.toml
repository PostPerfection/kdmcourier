[graph]
targets = []
all-features = true

[licenses]
allow = [
    # the app, postkit and asdcplib-rs are AGPL-3.0-or-later themselves
    "AGPL-3.0-or-later",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",  # target-lexicon
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",  # notify
    "CDLA-Permissive-2.0",  # webpki-roots
    "0BSD",  # quoted_printable
    "MPL-2.0",  # option-ext
    "WTFPL",  # ffmpeg-next, ffmpeg-sys-next
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
    "https://github.com/PostPerfection/asdcplib-rs",
]
