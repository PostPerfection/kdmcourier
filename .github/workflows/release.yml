name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Verify release version
        shell: bash
        run: |
          desktop_crate_version=$(awk '/^\[package\]/{found=1; next} /^\[/{found=0} found && /^version = / {gsub(/[" ]/, "", $3); print $3; exit}' gui/src-tauri/Cargo.toml)
          desktop_version=$(jq -r .version gui/src-tauri/tauri.conf.json)
          frontend_version=$(jq -r .version gui/package.json)

          release_version="$desktop_version"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            release_version="${GITHUB_REF_NAME#v}"
          fi

          for version in "$desktop_crate_version" "$desktop_version" "$frontend_version"; do
            if [ "$version" != "$release_version" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match project version $version"
              exit 1
            fi
          done

      - name: Release notes from CHANGELOG.md
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes="$RUNNER_TEMP/release-notes.md"
          awk -v heading="## [$version]" 'index($0, heading) == 1 {found = 1; next} found && /^## / {exit} found {print}' CHANGELOG.md > "$notes"
          if ! grep -q '[^[:space:]]' "$notes"; then
            echo "::error::CHANGELOG.md has no notes for $version"
            exit 1
          fi

      - name: Upload release notes
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes.md
          if-no-files-found: error

  gui:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: Linux
          - os: macos-latest
            name: macOS
          - os: windows-latest
            name: Windows

    runs-on: ${{ matrix.os }}
    name: GUI (${{ matrix.name }})

    steps:
      - name: Enable long paths (Windows)
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6.0.5
        with:
          version: 11.8.0

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxml2-dev libssl-dev libxerces-c-dev libasound2-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libarchive-tools

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake openssl xerces-c
          echo "OPENSSL_DIR=$(brew --prefix openssl)" >> $GITHUB_ENV
          echo "CMAKE_PREFIX_PATH=$(brew --prefix xerces-c):$(brew --prefix openssl)" >> $GITHUB_ENV

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' -y
          # vcpkg never retries a curl 56 or 503 from github's archive host
          for ($attempt = 1; $attempt -le 5; $attempt++) {
            vcpkg install xerces-c:x64-windows openssl:x64-windows libxml2:x64-windows
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq 5) { throw "vcpkg install failed after $attempt attempts" }
            Start-Sleep -Seconds (30 * $attempt)
          }
          echo "VCPKG_ROOT=C:\vcpkg" >> $env:GITHUB_ENV
          echo "CMAKE_TOOLCHAIN_FILE=C:\vcpkg\scripts\buildsystems\vcpkg.cmake" >> $env:GITHUB_ENV
          echo "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin" >> $env:GITHUB_PATH

      # postkit links ffmpeg
      - uses: PostPerfection/ffmpeg-mpv-builds@v1.0.0
        with:
          release: v1.0.0

      - name: Install frontend dependencies
        working-directory: gui
        run: pnpm install --frozen-lockfile

      # copies every dll the exe imports from outside System32, VC++ runtime included
      - name: Stage dlls (Windows)
        if: runner.os == 'Windows'
        run: |
          pnpm --dir gui build
          cargo build --release --manifest-path gui/src-tauri/Cargo.toml
          Copy-Item gui/src-tauri/target/release/kdmcourier-gui.exe gui/src-tauri/
          ./scripts/stage-windows-dlls.ps1 -Binary gui/src-tauri/kdmcourier-gui.exe -SearchDirectories "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin", "$env:FFMPEG_MPV_DIR/bin"
          Remove-Item gui/src-tauri/kdmcourier-gui.exe
          $dlls = @(Get-ChildItem gui/src-tauri/*.dll | ForEach-Object Name)
          $dlls
          # a tauri.windows.conf.json glob would fail every build that has no dlls staged
          ConvertTo-Json @{ bundle = @{ resources = $dlls } } -Depth 3 | Set-Content "$env:RUNNER_TEMP/bundle-libraries.json"
          Get-Content "$env:RUNNER_TEMP/bundle-libraries.json"

      - name: Stage dylibs (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          staging="$GITHUB_WORKSPACE/gui/src-tauri/macos-libraries"
          pnpm --dir gui build
          cargo build --release --manifest-path gui/src-tauri/Cargo.toml
          scripts/stage-macos-libraries.sh gui/src-tauri/target/release/kdmcourier-gui "$staging" "$FFMPEG_MPV_DIR/lib"
          ls -la "$staging"
          jq -n \
            --arg relink "bash $GITHUB_WORKSPACE/scripts/relink-macos.sh $staging" \
            --argjson frameworks "$(find "$staging" -name '*.dylib' | sort | jq -R . | jq -s -c .)" \
            --arg licence "$FFMPEG_MPV_DIR/THIRD-PARTY-LICENSES" \
            '{build: {beforeBundleCommand: $relink}, bundle: {macOS: {frameworks: $frameworks}, resources: {($licence): "THIRD-PARTY-LICENSES-ffmpeg-mpv.txt"}}}' \
            > "$RUNNER_TEMP/bundle-libraries.json"
          jq . "$RUNNER_TEMP/bundle-libraries.json"

      - uses: tauri-apps/tauri-action@v0
        with:
          projectPath: gui
          args: ${{ runner.os != 'Linux' && format('--config {0}/bundle-libraries.json', runner.temp) || '' }}

      # ffmpeg-mpv-builds exports LD_LIBRARY_PATH, which would hide a library the package does not carry
      - name: The packages load only system libraries (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          bundle=gui/src-tauri/target/release/bundle
          binary=usr/bin/kdmcourier-gui

          check_binary() {
            local libraries
            libraries=$(env -u LD_LIBRARY_PATH ldd "$1")
            echo "$libraries"
            if echo "$libraries" | grep -F "not found"; then
              echo "$1 has an unresolved library"
              exit 1
            fi
            if echo "$libraries" | grep -F -e "$GITHUB_WORKSPACE" -e "$RUNNER_TEMP"; then
              echo "$1 loads a library from the build tree"
              exit 1
            fi
          }

          appimage=$(realpath "$(find "$bundle/appimage" -name '*.AppImage' -print -quit)")
          appimage_root=$(mktemp -d)
          (cd "$appimage_root" && "$appimage" --appimage-extract >/dev/null)
          check_binary "$appimage_root/squashfs-root/$binary"

          deb=$(find "$bundle/deb" -name '*.deb' -print -quit)
          dpkg-deb -f "$deb" Depends
          deb_root=$(mktemp -d)
          dpkg-deb -x "$deb" "$deb_root"
          check_binary "$deb_root/$binary"

          rpm=$(realpath "$(find "$bundle/rpm" -name '*.rpm' -print -quit)")
          rpm_root=$(mktemp -d)
          bsdtar -xf "$rpm" -C "$rpm_root"
          check_binary "$rpm_root/$binary"

      # ffmpeg-mpv-builds exports DYLD_LIBRARY_PATH, which would hide a library the .app does not carry
      - name: The app loads its libraries from the bundle (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          bundle=gui/src-tauri/target/release/bundle
          ls -la "$bundle/macos" "$bundle/dmg"
          if [ -z "$(find "$bundle/dmg" -name '*.dmg' -print -quit)" ]; then
            echo "no dmg under $bundle/dmg"
            exit 1
          fi
          app=$(find "$bundle/macos" -maxdepth 1 -name '*.app' -print -quit)
          if [ -z "$app" ]; then
            echo "no .app under $bundle/macos"
            exit 1
          fi
          binary="$app/Contents/MacOS/kdmcourier-gui"
          frameworks="$app/Contents/Frameworks"
          ls -la "$frameworks"
          if [ ! -f "$app/Contents/Resources/THIRD-PARTY-LICENSES-ffmpeg-mpv.txt" ]; then
            echo "the app does not carry Contents/Resources/THIRD-PARTY-LICENSES-ffmpeg-mpv.txt"
            exit 1
          fi
          if ! otool -l "$binary" | grep -qF "path @executable_path/../Frameworks ("; then
            echo "$binary does not search Contents/Frameworks"
            exit 1
          fi
          for file in "$binary" "$frameworks"/*.dylib; do
            otool -L "$file"
            own_id=$(otool -D "$file" | tail -n +2)
            # otool -L lists a dylib's own id among its references
            for reference in $(otool -L "$file" | awk -v own_id="$own_id" 'NR > 1 && $1 != own_id {print $1}'); do
              case "$reference" in
                /usr/lib/* | /System/*) ;;
                @rpath/* | @executable_path/* | @loader_path/*)
                  if [ ! -f "$frameworks/$(basename "$reference")" ]; then
                    echo "$file loads $reference, which Contents/Frameworks does not carry"
                    exit 1
                  fi
                  ;;
                *)
                  echo "$file loads $reference from outside the app"
                  exit 1
                  ;;
              esac
            done
          done
          # a missing dylib kills the app at exec, so it has to be alive a few seconds later
          env -u DYLD_LIBRARY_PATH -u DYLD_FALLBACK_LIBRARY_PATH "$binary" &
          app_pid=$!
          sleep 8
          kill -0 "$app_pid"
          kill "$app_pid"

      - name: The installer carries its dlls (Windows)
        if: runner.os == 'Windows'
        run: |
          $installer = Get-ChildItem "gui/src-tauri/target/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          if ($null -eq $installer) { throw "NSIS installer not found" }
          if ($null -eq (Get-ChildItem "gui/src-tauri/target/release/bundle/msi/*.msi" | Select-Object -First 1)) { throw "msi not found" }
          $install = Start-Process -FilePath $installer.FullName -ArgumentList "/S" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer exited with $($install.ExitCode)" }
          $entry = Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*" |
            Where-Object { $_.DisplayName -eq "KDM Courier" } |
            Select-Object -First 1
          if ($null -eq $entry) { throw "Installed application was not registered" }
          $installDirectory = $entry.InstallLocation.Trim('"')
          Get-ChildItem $installDirectory
          if (-not (Test-Path (Join-Path $installDirectory "kdmcourier-gui.exe"))) { throw "the installer does not carry kdmcourier-gui.exe" }
          foreach ($dll in Get-ChildItem gui/src-tauri/*.dll) {
            if (-not (Test-Path (Join-Path $installDirectory $dll.Name))) { throw "the installer does not carry $($dll.Name)" }
          }


      - name: Upload the bundles
        uses: actions/upload-artifact@v4
        with:
          name: kdmcourier-${{ matrix.name }}
          path: |
            gui/src-tauri/target/release/bundle/appimage/*.AppImage
            gui/src-tauri/target/release/bundle/deb/*.deb
            gui/src-tauri/target/release/bundle/rpm/*.rpm
            gui/src-tauri/target/release/bundle/dmg/*.dmg
            gui/src-tauri/target/release/bundle/nsis/*-setup.exe
            gui/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: [gui]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download tested packages
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: KDM Courier ${{ github.ref_name }}
          body_path: artifacts/release-notes/release-notes.md
          fail_on_unmatched_files: true
          files: |
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/**/*.AppImage
            artifacts/**/*.dmg
            artifacts/**/*.msi
            artifacts/**/*-setup.exe
