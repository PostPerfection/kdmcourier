name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  gui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6.0.5
        with:
          version: 11.8.0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: gui/pnpm-lock.yaml

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxml2-dev libssl-dev libxerces-c-dev libasound2-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev

      # postkit links ffmpeg
      - uses: PostPerfection/ffmpeg-mpv-builds@v1.0.0
        with:
          release: v1.0.0

      - name: Build frontend
        working-directory: gui
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Frontend tests
        working-directory: gui
        run: pnpm test

      - name: Test Tauri backend
        working-directory: gui/src-tauri
        run: cargo test

      - name: Clippy Tauri backend
        working-directory: gui/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Format check Tauri backend
        working-directory: gui/src-tauri
        run: cargo fmt -- --check

      - name: Build the GUI
        # without custom-protocol tauri builds a dev binary that loads the vite
        # dev url instead of the embedded frontend, tauri build turns it on
        run: cargo build --release --manifest-path gui/src-tauri/Cargo.toml --features tauri/custom-protocol

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - uses: taiki-e/install-action@cargo-deny

      - name: Cargo deny
        working-directory: gui/src-tauri
        run: cargo deny check bans licenses sources
